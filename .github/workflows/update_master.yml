name: Update Angel One Scrip Master

on:
  schedule:
    - cron: '0 3 * * 1-5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download and Filter Scrip Master
        run: |
          python3 -c "
          import urllib.request, json, gzip
          url = 'https://angelone.in'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          data = json.loads(urllib.request.urlopen(req, timeout=60).read().decode('utf-8'))
          filtered = [x for x in data if x.get('exch_seg') == 'NFO' or (x.get('exch_seg') == 'NSE' and str(x.get('symbol', '')).endswith('-EQ'))]
          with gzip.open('master.json.gz', 'wt', encoding='utf-8') as f:
              json.dump(filtered, f)
          "
      - name: Commit file
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add master.json.gz
          git commit -m "Update scrip master" || exit 0
          git push
